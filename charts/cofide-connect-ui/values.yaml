# Default values for cofide-connect-ui.

replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # Container image registry. If empty, the repository is used unqualified.
  registry: 010438484483.dkr.ecr.eu-west-1.amazonaws.com
  repository: cofide/connect-ui
  pullPolicy: IfNotPresent
  # Defaults to chart appVersion if not set.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# Override chart name
nameOverride: ""
fullnameOverride: ""

# Service configuration
service:
  type: LoadBalancer
  annotations: {}
  port: 8443

# Pod-level security context
securityContext:
  fsGroup: 65532

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables to pass to the UI container
env: {}

# UI-specific configuration consumed by templates and the running app
ui:
  hostname: ""
  connectUrl: ""
  oauth:
    clientId: ""
    issuer: ""
    audience: "" # Defaults to connectUrl's scheme://hostname
    scopes:
      - openid
      - offline_access
      - email

# Envoy sidecar config used to proxy traffic to the UI
envoy:
  image:
    registry: docker.io
    repository: envoyproxy/envoy
    pullPolicy: IfNotPresent
    tag: v1.33.14
  configMapName: connect-ui-envoy-config
  tlsSecretName: envoy-tls
  resources: {}

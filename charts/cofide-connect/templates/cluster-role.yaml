kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}
rules:
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterfederatedtrustdomains"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["spire.spiffe.io"]
    resources: ["clusterspiffeids"]
    {{- with .Values.rbac.clusterSpiffeIdName }}
    resourceNames: [{{ . | quote }}]
    {{- end }}
    verbs: ["get", "update"]

{{- $datastoreUsed := 0 -}}
{{- $trustBundleStoreBackendUsed := 0 -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cofide-connect.fullname" . }}
  labels:
    {{- include "cofide-connect.labels" . | nindent 4 }}
data:
  config.yaml: |
    insecure_server_address: {{ .Values.connect.insecureServerAddress.host }}:{{ .Values.connect.insecureServerAddress.port }}
    ads_server_address: {{ .Values.connect.adsServerAddress.host }}:{{ .Values.connect.adsServerAddress.port }}
    spiffe_endpoint_socket: {{ .Values.connect.spiffeEndpointSocket }}
    trust_bundle_store_backend:
      {{- with .Values.connect.trustBundleStoreBackend.s3 }}
      {{- if .enabled }}
        {{- $trustBundleStoreBackendUsed = add $trustBundleStoreBackendUsed 1 }}
      {{- end }}
      s3:
        enabled: {{ .enabled }}
        bucket: {{ .bucket }}
        use_path_style: {{ .usePathStyle }}
        {{- with .encryption }}
        {{- if and .kmsKeyId (ne .type "SSE-KMS") }}
        {{- fail (printf "connect.trustBundleStoreBackend.s3.encryption.kmsKeyId is only valid when type is \"SSE-KMS\" (got type: %q, kmsKeyId: %q)" .type .kmsKeyId) }}
        {{- end }}
        encryption:
          type: {{ .type | quote }}
          kms_key_id: {{ .kmsKeyId | quote }}
        {{- end }}
        {{- with .oidc }}
        oidc:
          enabled: {{ .enabled }}
          aws_region: {{ .awsRegion }}
          iam_role_arn: {{ .iamRoleARN }}
          audience: {{ .audience }}
        {{- end }}
      {{- end }}
      {{- with .Values.connect.trustBundleStoreBackend.gcs }}
      {{- if .enabled }}
        {{- $trustBundleStoreBackendUsed = add $trustBundleStoreBackendUsed 1 }}
      {{- end }}
      gcs:
        enabled: {{ .enabled }}
        bucket: {{ .bucket }}
        {{- with .oidc }}
        oidc:
          enabled: {{ .enabled }}
          workload_identity_provider: {{ .workloadIdentityProvider }}
          audience: {{ .audience }}
        {{- end }}
      {{- end }}
    datastore:
      {{- with .Values.connect.datastore.sqlConnectionString }}
      {{- if .enabled }}
        {{- $datastoreUsed = add $datastoreUsed 1 }}
      {{- end }}
      sql_connection_string:
        enabled: {{ .enabled }}
        connection_string: {{ .connectionString | quote }}
        remote_spiffe_id: {{ .remoteSPIFFEID | quote }}
      {{- end }}
      {{- with .Values.connect.datastore.cloudSQL }}
      {{- if .enabled }}
        {{- $datastoreUsed = add $datastoreUsed 1 }}
      {{- end }}
      cloudsql:
        enabled: {{ .enabled }}
        instance: {{ .instance | quote }}
        database_name: {{ .databaseName | quote }}
        psc_enabled: {{ .pscEnabled }}
        {{- with .oidc }}
        oidc:
          workload_identity_provider: {{ .workloadIdentityProvider | quote }}
          audience: {{ .audience | quote }}
          service_account_name: {{ .serviceAccountName | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.connect.datastore.rds }}
      {{- if .enabled }}
        {{- $datastoreUsed = add $datastoreUsed 1 }}
      {{- end }}
      rds:
        enabled: {{ .enabled }}
        host: {{ .host | quote }}
        port: {{ .port }}
        database_name: {{ .databaseName | quote }}
        db_user: {{ .dbUser | quote }}
        {{- with .oidc }}
        oidc:
          aws_region: {{ .awsRegion | quote }}
          iam_role_arn: {{ .iamRoleARN | quote }}
          audience: {{ .audience | quote }}
        {{- end }}
        max_open_conns: {{ .maxOpenConns }}
        conn_max_lifetime: {{ .connMaxLifetime | quote }}
        conn_max_idle_time: {{ .connMaxIdleTime | quote }}
      {{- end }}
    connect_psat_audience: {{ .Values.connect.connectPSATAudience }}
    connect_trust_domain: {{ .Values.connect.trustDomain }}
    connect_trust_bundle_store_url: {{ .Values.connect.connectTrustBundleStoreURL }}
    {{- with .Values.connect.telemetry }}
    {{- if .enabled }}
      {{- $authMethodsEnabled := 0 }}
      {{- range list .auth.spiffeMtls.enabled .auth.spiffeJwt.enabled .auth.k8sPSAT.enabled .auth.insecure.enabled }}
      {{- if . }}
        {{- $authMethodsEnabled = add $authMethodsEnabled 1 }}
      {{- end }}
      {{- end }}
      {{- if ne $authMethodsEnabled 1 }}
        {{- fail (printf "connect.telemetry.auth must enable exactly one authentication method (found %d)" $authMethodsEnabled) }}
      {{- end }}
    telemetry:
      enabled: {{ .enabled }}
      auth:
        spiffe_mtls:
          enabled: {{ .auth.spiffeMtls.enabled }}
          collector_spiffe_id: {{ .auth.spiffeMtls.collectorSpiffeId | quote }}
        spiffe_jwt:
          enabled: {{ .auth.spiffeJwt.enabled }}
          audience: {{ .auth.spiffeJwt.audience | quote }}
          tls:
            ca_file: {{ .auth.spiffeJwt.tls.caFile | quote }}
            server_name: {{ .auth.spiffeJwt.tls.serverName | quote }}
            insecure_skip_verify: {{ .auth.spiffeJwt.tls.insecureSkipVerify }}
        k8s_psat:
          enabled: {{ .auth.k8sPSAT.enabled }}
          token_path: {{ .auth.k8sPSAT.tokenPath | quote }}
          tls:
            ca_file: {{ .auth.k8sPSAT.tls.caFile | quote }}
            server_name: {{ .auth.k8sPSAT.tls.serverName | quote }}
            insecure_skip_verify: {{ .auth.k8sPSAT.tls.insecureSkipVerify }}
        insecure:
          enabled: {{ .auth.insecure.enabled }}
    {{/*
    Map deprecated telemetry config into new structure for backwards compatibility
    iff old telemetryEnabled field is supplied but new config isn't (i.e. old chart
    values used with newer chart version).
    */}}
    {{- else if $.Values.connect.telemetryEnabled }}
    telemetry:
      enabled: true
      auth:
        spiffe_mtls:
          enabled: true
          collector_spiffe_id: {{ printf "spiffe://%s/ns/otel-collector/sa/otel-collector-opentelemetry-collector" $.Values.connect.trustDomain | quote }}
    {{- end }}
    {{- end }}
    authz_policy_engine: {{ .Values.connect.authzPolicyEngine }}
    initial_rbac:
      version: {{ .Values.connect.initialRBAC.version }}
      role_bindings: {{- range .Values.connect.initialRBAC.roleBindings }}
        - role_id: {{ .roleID | quote }}
          resource_type: {{ .resourceType }}
          resource_id: {{ .resourceID | quote }}
          {{- if (hasKey . "user") }}
          user:
            subject: {{ .user.subject | quote }}
          {{- end }}
          {{- if (hasKey . "group") }}
          group:
            claim_value: {{ .group.claimValue | quote }}
          {{- end }}
      {{- end }}
    audit:
      sinks:
        connect_datastore:
          enabled_events:
            {{- if .Values.connect.audit.sinks.connectDatastore.enabledEvents }}
              {{- range .Values.connect.audit.sinks.connectDatastore.enabledEvents }}
            - {{ . | quote }}
              {{- end }}
            {{- else }} []
            {{- end }}
          disabled_events:
            {{- if .Values.connect.audit.sinks.connectDatastore.disabledEvents }}
              {{- range .Values.connect.audit.sinks.connectDatastore.disabledEvents }}
            - {{ . | quote }}
              {{- end }}
            {{- else }} []
            {{- end }}
{{- if ne $datastoreUsed 1 }}
{{- fail (printf "You must enable exactly one datastore. There are %d enabled." $datastoreUsed) }}
{{- end }}
{{- if ne $trustBundleStoreBackendUsed 1 }}
{{- fail (printf "You must enable exactly one trust bundle store backend. There are %d enabled." $trustBundleStoreBackendUsed) }}
{{- end }}
